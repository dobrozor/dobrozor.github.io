<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="theme-color" content="#030303">
    <title>Илья Зоренко</title>

    <link rel="icon" href="https://avatars.githubusercontent.com/u/105580858?v=4" type="image/x-icon">

    <script src="https://unpkg.com/@studio-freight/lenis@1.0.33/dist/lenis.min.js"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;800&family=Syncopate:wght@400;700&display=swap" rel="stylesheet">

    <style>
        :root {
            --bg: #030303;
            --card-bg: rgba(10, 10, 10, 0.92);
            --text: #e0e0e0;
            --accent: #ff003c;
            --accent-2: #00f3ff;
            --border: rgba(255, 255, 255, 0.1);
            --font-display: 'Syncopate', sans-serif;
            --font-code: 'JetBrains Mono', monospace;

            /* responsive card sizing, clamps between mobile & desktop */
            --card-w: clamp(240px, 78vw, 320px);
            --card-h: clamp(360px, 62vh, 460px);
            --card-radius: clamp(140px, 34vw, 380px);
        }

        * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }

        html, body {
            margin: 0; padding: 0;
            background: var(--bg);
            color: var(--text);
            font-family: var(--font-display);
            overflow: hidden;
            width: 100%; height: 100%;
            overscroll-behavior: none;
            touch-action: pan-y;
        }

        .scanlines { position: fixed; inset: 0; background: linear-gradient(to bottom, transparent 50%, rgba(0,0,0,0.3) 50%); background-size: 100% 5px; pointer-events: none; z-index: 10; }
        .noise { position: fixed; inset: 0; z-index: 12; opacity: 0.05; pointer-events: none; background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 200 200' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.8'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)'/%3E%3C/svg%3E"); }

        .hud {
            position: fixed;
            inset: env(safe-area-inset-top, 1rem) env(safe-area-inset-right, 1rem) env(safe-area-inset-bottom, 1rem) env(safe-area-inset-left, 1rem);
            margin: 1.5rem;
            z-index: 20; pointer-events: none;
            display: flex; flex-direction: column; justify-content: space-between;
            font-family: var(--font-code); font-size: 10px; color: rgba(255,255,255,0.5); text-transform: uppercase;
        }
        .hud-line { flex: 1; height: 1px; background: rgba(255,255,255,0.2); margin: 0 1rem; }
        .hud-top, .hud-bottom { display: flex; justify-content: space-between; align-items: center; }
        .hud-side { margin-top: auto; margin-bottom: auto; writing-mode: vertical-rl; transform: rotate(180deg); opacity: 0.5; }

        .viewport { position: fixed; inset: 0; perspective: 1000px; z-index: 1; overflow: hidden; }
        .world { position: absolute; top: 50%; left: 50%; transform-style: preserve-3d; transition: transform 0.15s ease-out; will-change: transform; }
        .item { position: absolute; top: 0; left: 0; transform-style: preserve-3d; pointer-events: none; will-change: transform, opacity; }

        .card {
            width: var(--card-w); height: var(--card-h);
            background: var(--card-bg);
            border: 1px solid var(--border);
            padding: clamp(1rem, 4vw, 1.5rem);
            display: flex; flex-direction: column;
            backdrop-filter: blur(15px);
            -webkit-backdrop-filter: blur(15px);
            transform: translate(-50%, -50%);
            transition: border-color 0.3s, box-shadow 0.3s;
            pointer-events: none;
        }

        .item.active .card { pointer-events: all; }
        .card:hover, .card:active { border-color: var(--accent); box-shadow: 0 0 30px rgba(255, 0, 60, 0.4); }

        .card-header { font-family: var(--font-code); color: var(--accent); font-size: 0.65rem; margin-bottom: 0.75rem; display: flex; justify-content: space-between; }
        .card h2 { font-size: clamp(1.1rem, 5vw, 1.5rem); margin: 0 0 0.75rem 0; line-height: 1.05; text-transform: uppercase; color: #fff; }
        .card p { font-family: var(--font-code); font-size: clamp(0.75rem, 3.2vw, 0.85rem); line-height: 1.4; color: #bbb; margin: 0; overflow-y: auto; }

        .card-img { width: 100%; height: clamp(130px, 24vh, 180px); background: #111; margin: 0.85rem 0; border: 1px solid var(--border); overflow: hidden; flex-shrink: 0; }
        .card-img img { width: 100%; height: 100%; object-fit: cover; filter: grayscale(0.4); transition: 0.5s; }
        .card:hover .card-img img, .card:active .card-img img { filter: grayscale(0); }

        .card-btn {
            margin-top: auto;
            background: var(--accent);
            color: #fff;
            border: none;
            padding: 0.9rem;
            font-family: var(--font-code);
            font-weight: 800;
            font-size: 0.75rem;
            text-transform: uppercase;
            cursor: pointer;
            transition: 0.2s;
            text-align: center;
            text-decoration: none;
            display: block;
            z-index: 100;
            touch-action: manipulation;
        }
        .card-btn:active { background: var(--accent-2); color: #000; }

        .big-text {
            font-size: clamp(3.5rem, 16vw, 14vw); font-weight: 800; color: transparent;
            -webkit-text-stroke: 2px rgba(255, 255, 255, 0.15);
            text-transform: uppercase; white-space: nowrap;
            transform: translate(-50%, -50%); pointer-events: none;
            mix-blend-mode: screen;
            transition: text-shadow 0.1s;
        }

        .star { position: absolute; width: 2px; height: 2px; background: white; pointer-events: none; }
        .scroll-proxy { height: 20000vh; position: absolute; width: 100%; z-index: -1; }

        /* swipe hint, mobile only, fades after first interaction */
        .swipe-hint {
            position: fixed; left: 50%; bottom: calc(env(safe-area-inset-bottom, 0px) + 1.5rem);
            transform: translateX(-50%);
            z-index: 25; font-family: var(--font-code); font-size: 10px; letter-spacing: 0.15em;
            color: rgba(255,255,255,0.55); text-transform: uppercase; pointer-events: none;
            display: flex; align-items: center; gap: 0.5rem;
            opacity: 1; transition: opacity 0.6s ease;
        }
        .swipe-hint .arrow { animation: bob 1.4s ease-in-out infinite; }
        @keyframes bob { 0%,100% { transform: translateY(0); } 50% { transform: translateY(6px); } }
        .swipe-hint.hidden { opacity: 0; }

        @media (hover: none) and (pointer: coarse) {
            .hud { font-size: 9px; margin: 1rem; }
            .hud-side { display: none; } /* vertical side label eats space on narrow screens */
            .card:hover { border-color: var(--border); box-shadow: none; } /* avoid sticky hover state on touch */
        }

        @media (max-width: 380px) {
            .hud { font-size: 8px; }
            .card-header { font-size: 0.6rem; }
        }

        @media (max-height: 600px) {
            :root { --card-h: clamp(300px, 78vh, 460px); }
            .card-img { display: none; }
        }
    </style>
</head>
<body>

    <div class="scanlines"></div>
    <div class="noise"></div>

    <div class="hud">
        <div class="hud-top">
            <span>СТАТУС: ВЕЧНЫЙ_ПРОГРУЗ</span>
            <div class="hud-line"></div>
            <span>ПОРТФОЛИОБОТ</span>
        </div>
        <div class="hud-side">
            ИЛЬЯ_ЗОРЕНКО ЭНТЕРТЕЙМЕНТ
        </div>
        <div class="hud-bottom">
            <span>КООРДЫ: <strong id="coord">0</strong></span>
            <div class="hud-line"></div>
            <span>СКОРОСТЬ: <strong id="vel">0.00</strong></span>
        </div>
    </div>

    <div class="viewport" id="viewport">
        <div class="world" id="world"></div>
    </div>

    <div class="swipe-hint" id="swipeHint"><span class="arrow">↓</span> СВАЙП ЧТОБЫ ЛИСТАТЬ</div>

    <div class="scroll-proxy"></div>

    <script>
        const SECTIONS = [
            {
                header: "ОБО МНЕ",
                items: [
                    {
                        type: 'text',
                        title: 'КТО Я',
                        desc: 'Привет, меня зовут Илья! Если коротко - ведущий, граф.дизайнер, вайб-кодер',
                        img: 'https://i.ibb.co/VY8yM3xM/photo-2300131587933276929-c.jpg',
                        link: 'https://t.me/dobrozor',
                        btnText: 'НАПИСАТЬ МНЕ'
                    },
                    { type: 'text', title: 'СТЕК', desc: 'Gemini, Qwen, DeepSeek, Python, Photoshop, illutrator' },
                    { type: 'text', title: 'ДЕЛАЮ', desc: 'Логотипы, баннеры, ботов в телеграмм, скрипты и автоматизирую работу' }
                ]
            },
            {
                header: "ДИЗАЙН",
                items: [
                    { type: 'image', title: 'Счастливые козочки', desc: 'Среди лугов, где солнце светит ярко, Пасутся козы, зная лишь покой. Для всей семьи нет лучшего подарка, Чем этот вкус — полезный и родной.', img: 'https://i.ibb.co/1t1kHL32/photo-5395499593145384959-y.jpg' },
                    { type: 'image', title: 'Северный ветер', desc: 'Лед закипает под коньком каленым, «Северный ветер» — воля и азарт. Победа светит взглядам непреклонным, Сметает всё наш мощный, быстрый старт!', img: 'https://i.ibb.co/pBhcw1n1/photo-5352647939929007730-w.jpg' },
                    { type: 'image', title: 'HGS', desc: 'Код пишет жизнь, экран огнем сияет, Команда HGS миры творит. Нас драйв и креативность окрыляют, И новый левел в сердце говорит!', img: 'https://i.ibb.co/DHBCgq0f/photo-5390888129709336317-y.jpg' }
                ]
            },
            {
                header: "РАЗРАБОТКА",
                items: [
                    { type: 'button', title: 'dobro_loader', desc: 'Это чудо-юдо скачивает видосы с защитой kinescope. Ему вообще пофиг, это clearkey или widiwine, а может вообще шифрования там и нет. Он всё расшифрует, скачает и ты будешь наслаждаться своим бесПЛАТНЫМ курсом.', link: 'https://github.com/dobrozor/DOBRO_LOADER' },
                    { type: 'button', title: 'FunPaySeller', desc: 'Этот скрипт отлично автоматизирует продажу звезд телеграмма на фанпее. А главное мне не нужен твой крипто кошелек и скрипт ничего не ворует, простая и легкая автоматизация', link: 'https://github.com/dobrozor/FunPaySaller' },
                    { type: 'button', title: 'TG_Stars', desc: 'А этот бот телеграмм продаст такие же звезды телеграмм, но уже не будет лутать никаких комиссий. И да, скрипт беслптаный с подробной инструкцией - продавать сможет начать буквально каждый', link: 'https://github.com/dobrozor/tg_buy_stars' }
                ]
            }
        ];

        // detect low-power / small-screen mobile devices to scale down heavy effects
        const isMobile = window.matchMedia('(hover: none) and (pointer: coarse)').matches || window.innerWidth < 700;

        const CONFIG = {
            zGap: 1000,
            starCount: isMobile ? 60 : 150,   // fewer stars on mobile for performance
            camSpeed: 3.5,
            loopSize: 0,
            cardRadiusX: isMobile ? Math.min(180, window.innerWidth * 0.45) : 380,
            cardRadiusY: isMobile ? 130 : 220,
            tiltStrength: isMobile ? 3 : 5     // gentler tilt on mobile (from device motion / drag)
        };

        const state = { scroll: 0, velocity: 0, targetSpeed: 0, mouseX: 0, mouseY: 0 };
        const world = document.getElementById('world');
        const items = [];

        function init() {
            let currentZ = 0;

            SECTIONS.forEach((section) => {
                const hEl = document.createElement('div');
                hEl.className = 'item';
                hEl.innerHTML = `<div class="big-text">${section.header}</div>`;
                items.push({ el: hEl, x: 0, y: 0, baseZ: -currentZ * CONFIG.zGap, type: 'header' });
                world.appendChild(hEl);
                currentZ++;

                section.items.forEach((data, i) => {
                    const el = document.createElement('div');
                    el.className = 'item';

                    let content = `
                        <div class="card">
                            <div class="card-header"><span>DOB_0${i+1}</span><span>//2026</span></div>
                            <h2>${data.title}</h2>
                            <p>${data.desc}</p>
                    `;

                    if (data.img) {
                        content += `<div class="card-img"><img src="${data.img}" loading="lazy"></div>`;
                    }

                    if (data.link) {
                        const text = data.btnText || 'ОТКРЫТЬ ПРОЕКТ';
                        content += `<a href="${data.link}" target="_blank" rel="noopener" class="card-btn">${text}</a>`;
                    }

                    content += `</div>`;
                    el.innerHTML = content;

                    const angle = (i / 3) * Math.PI * 2;
                    items.push({
                        el, type: 'card',
                        x: Math.cos(angle) * CONFIG.cardRadiusX,
                        y: Math.sin(angle) * CONFIG.cardRadiusY,
                        baseZ: -currentZ * CONFIG.zGap,
                        rot: (Math.random() - 0.5) * 10
                    });
                    world.appendChild(el);
                    currentZ++;
                });
                currentZ += 0.5;
            });

            CONFIG.loopSize = currentZ * CONFIG.zGap;

            for (let i = 0; i < CONFIG.starCount; i++) {
                const el = document.createElement('div');
                el.className = 'star';
                world.appendChild(el);
                items.push({
                    el, type: 'star',
                    x: (Math.random() - 0.5) * 4000,
                    y: (Math.random() - 0.5) * 4000,
                    baseZ: -Math.random() * CONFIG.loopSize
                });
            }

            bindPointerTilt();
        }

        // unified pointer handling: mouse move OR touch drag both drive the tilt.
        // Doesn't interfere with Lenis's vertical scroll gesture.
        function bindPointerTilt() {
            const hint = document.getElementById('swipeHint');
            let hintDismissed = false;
            const dismissHint = () => {
                if (hintDismissed) return;
                hintDismissed = true;
                hint.classList.add('hidden');
            };

            window.addEventListener('mousemove', (e) => {
                state.mouseX = (e.clientX / window.innerWidth - 0.5) * 2;
                state.mouseY = (e.clientY / window.innerHeight - 0.5) * 2;
                dismissHint();
            });

            // lightweight touch-based tilt: use the touch point relative to screen center,
            // updated only while a finger is down, so it doesn't fight the scroll gesture.
            window.addEventListener('touchstart', dismissHint, { passive: true });
            window.addEventListener('touchmove', (e) => {
                if (!e.touches || !e.touches[0]) return;
                const t = e.touches[0];
                state.mouseX = (t.clientX / window.innerWidth - 0.5) * 2;
                state.mouseY = (t.clientY / window.innerHeight - 0.5) * 2;
            }, { passive: true });

            window.addEventListener('touchend', () => {
                // ease tilt back toward center when the finger lifts
                state.mouseX = 0;
                state.mouseY = 0;
            });

            window.addEventListener('scroll', dismissHint, { passive: true });
        }

        const lenis = new Lenis({
            lerp: isMobile ? 0.12 : 0.08,
            infinite: true,
            touchMultiplier: 1.5,
            smoothWheel: true
        });
        lenis.on('scroll', ({ scroll, velocity }) => {
            state.scroll = scroll;
            state.targetSpeed = velocity;
        });

        function raf(time) {
            lenis.raf(time);
            state.velocity += (state.targetSpeed - state.velocity) * 0.1;

            document.getElementById('coord').innerText = Math.floor(state.scroll);
            document.getElementById('vel').innerText = Math.abs(state.velocity).toFixed(2);

            const tiltX = state.mouseY * CONFIG.tiltStrength;
            const tiltY = state.mouseX * CONFIG.tiltStrength;
            world.style.transform = `rotateX(${tiltX}deg) rotateY(${tiltY}deg)`;

            const cameraZ = state.scroll * CONFIG.camSpeed;

            items.forEach(item => {
                let relZ = item.baseZ + cameraZ;
                let vizZ = ((relZ % CONFIG.loopSize) + CONFIG.loopSize) % CONFIG.loopSize;

                if (vizZ > 1000) vizZ -= CONFIG.loopSize;

                let alpha = 1;
                if (vizZ > 400) alpha = 1 - (vizZ - 400) / 600;
                else if (vizZ < -3000) alpha = 1 + (vizZ + 3000) / 1000;

                alpha = Math.max(0, Math.min(1, alpha));
                item.el.style.opacity = alpha;

                if (vizZ > -1200 && vizZ < 600 && alpha > 0.5) {
                    item.el.classList.add('active');
                } else {
                    item.el.classList.remove('active');
                }

                if (item.type === 'header') {
                    const textEl = item.el.querySelector('.big-text');
                    if (Math.abs(state.velocity) > 0.3) {
                        const shift = state.velocity * 3;
                        textEl.style.textShadow = `${shift}px 0 rgba(255,0,60,0.7), ${-shift}px 0 rgba(0,243,255,0.7)`;
                    } else {
                        textEl.style.textShadow = 'none';
                    }
                }

                let transform = `translate3d(${item.x}px, ${item.y}px, ${vizZ}px)`;
                if (item.rot) transform += ` rotateZ(${item.rot}deg)`;

                if (item.type === 'card') {
                    const drift = Math.sin(time * 0.001 + item.x) * (isMobile ? 8 : 15);
                    transform += ` translateY(${drift}px)`;
                }

                item.el.style.transform = transform;
            });

            requestAnimationFrame(raf);
        }

        init();
        requestAnimationFrame(raf);
    </script>
</body>
</html>
